    <script>
      (function() {
        try {
          var _fetch = typeof window !== 'undefined' ? window.fetch : null;
          var descriptor = {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {}
          }

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e) {}
          }

          if (typeof globalThis !== 'undefined') {
            try {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            } catch (e) {}
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
